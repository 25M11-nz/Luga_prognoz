<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейронная сеть — Регрессия</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Предсказание с помощью нейронной сети</h1>

        <form id="predictionForm">
            <div class="input-group">
                <label for="var2">Уровень на первый день без ледовых явлений на р. Луга - г. Луга:</label>
                <input type="number" id="var2" name="var2" step="any" required
                       placeholder="Введите значение">
            </div>

            <div class="input-group">
                <label for="var3">Средняя температура воздуха в феврале по ГМС Кингисепп:</label>
                <input type="number" id="var3" name="var3" step="any" required
                       placeholder="Введите значение">
            </div>

            <button type="submit">Рассчитать</button>
        </form>

        <div id="result" class="result">
            <!-- Здесь будет отображаться результат -->
        </div>
    </div>

    <!-- Контейнеры для графиков -->
    <div class="container" style="margin-top: 2rem;">
        <h2>График фактических и прогнозируемых значений</h2>
        <div id="comparisonChart" style="height: 400px;"></div>
    </div>

    <div class="container" style="margin-top: 2rem;">
        <h2>График ошибок модели</h2>
        <div id="errorChart" style="height: 400px;"></div>
    </div>

    <script>
        // Данные для графиков (фактические и прогнозируемые значения)
        const historicalData = {
            years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023],
            actual: [245, 267, 289, 312, 298, 334, 356, 378, 345, 367, 389, 412, 398, 423],
            predicted: [250, 270, 285, 308, 302, 330, 352, 375, 348, 365, 385, 408, 395, 418]
        };

        // Расчет ошибок
        const errors = historicalData.actual.map((actual, index) => {
            return Math.abs(actual - historicalData.predicted[index]);
        });

        // График 1: Сравнение фактических и прогнозируемых значений
        const comparisonTrace1 = {
            x: historicalData.years,
            y: historicalData.actual,
            name: 'Фактические значения',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: 'blue', width: 2 },
            marker: { size: 8, color: 'blue' }
        };

        const comparisonTrace2 = {
            x: historicalData.years,
            y: historicalData.predicted,
            name: 'Прогнозируемые значения',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: 'red', width: 2, dash: 'dash' },
            marker: { size: 8, color: 'red' }
        };

        const comparisonLayout = {
            title: 'Сравнение фактических и прогнозируемых значений уровня воды',
            xaxis: { title: 'Год', gridcolor: '#e0e0e0' },
            yaxis: { title: 'Уровень воды (см)', gridcolor: '#e0e0e0' },
            hovermode: 'closest',
            plot_bgcolor: '#f8f9fa',
            paper_bgcolor: 'white',
            legend: { x: 0.02, y: 0.98, bgcolor: 'rgba(255,255,255,0.8)' }
        };

        Plotly.newPlot('comparisonChart', [comparisonTrace1, comparisonTrace2], comparisonLayout);

        // График 2: Ошибки модели
        const errorTrace = {
            x: historicalData.years,
            y: errors,
            name: 'Абсолютная ошибка',
            type: 'bar',
            marker: {
                color: errors.map(err => err > 10 ? '#dc3545' : '#28a745'),
                line: { color: 'rgba(0,0,0,0.1)', width: 1 }
            },
            text: errors.map(err => err.toFixed(2) + ' см'),
            textposition: 'auto'
        };

        const errorLayout = {
            title: 'Абсолютная ошибка прогноза по годам',
            xaxis: { title: 'Год', gridcolor: '#e0e0e0' },
            yaxis: { title: 'Ошибка (см)', gridcolor: '#e0e0e0' },
            hovermode: 'closest',
            plot_bgcolor: '#f8f9fa',
            paper_bgcolor: 'white',
            showlegend: false,
            annotations: [{
                x: 0.5,
                y: 1.05,
                xref: 'paper',
                yref: 'paper',
                text: 'Средняя ошибка: ' + (errors.reduce((a,b) => a+b, 0) / errors.length).toFixed(2) + ' см',
                showarrow: false,
                font: { size: 14, color: '#333' }
            }]
        };

        Plotly.newPlot('errorChart', [errorTrace], errorLayout);

        // Обновление графиков при новом прогнозе
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const var2 = parseFloat(formData.get('var2'));
            const var3 = parseFloat(formData.get('var3'));

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                const resultDiv = document.getElementById('result');

                if (result.success) {
                    const prediction = parseFloat(result.prediction);
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>Результат расчёта:</h3>
                            <p><strong>Предсказанное значение максимального уровня воды на р. Луга - г. Луга:</strong> ${result.prediction} см</p>
                        </div>`;

                    // Добавляем новую точку на графики
                    const currentYear = new Date().getFullYear();
                    
                    // Обновляем график сравнения
                    Plotly.extendTraces('comparisonChart', {
                        x: [[currentYear]],
                        y: [[prediction]]
                    }, [1]); // Индекс 1 - прогнозируемые значения

                    // Добавляем новую ошибку (для демонстрации используем случайное фактическое значение)
                    // В реальном приложении здесь должно быть фактическое значение
                    const estimatedError = Math.abs(prediction - (prediction * (0.95 + Math.random() * 0.1)));
                    
                    Plotly.extendTraces('errorChart', {
                        x: [[currentYear]],
                        y: [[estimatedError]]
                    }, [0]);

                    // Показываем уведомление
                    showNotification('Новый прогноз добавлен на график!', 'success');
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>Ошибка:</h3>
                            <p>${result.error}</p>
                        </div>`;
                    showNotification(result.error, 'error');
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div class="error">
                        <h3>Ошибка соединения:</h3>
                        <p>Не удалось подключиться к серверу</p>
                    </div>`;
                showNotification('Ошибка соединения с сервером', 'error');
            }
        });

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = message;
            notification.style.position = 'fixed';
            notification.style.top = '20px';
            notification.style.right = '20px';
            notification.style.padding = '15px 20px';
            notification.style.borderRadius = '8px';
            notification.style.zIndex = '1000';
            notification.style.animation = 'slideIn 0.3s ease-out';
            
            if (type === 'success') {
                notification.style.backgroundColor = '#d4edda';
                notification.style.color = '#155724';
                notification.style.border = '1px solid #c3e6cb';
            } else {
                notification.style.backgroundColor = '#f8d7da';
                notification.style.color = '#721c24';
                notification.style.border = '1px solid #f5c6cb';
            }
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Добавляем CSS анимации для уведомлений
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
