<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейронная сеть - Прогнозирование уровня воды</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba1 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 2rem auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }

        h2 {
            color: #555;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #555;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba1 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .result {
            margin-top: 1.5rem;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }

        .prediction-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba1 100%);
            color: white;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 0.3rem;
        }

        .info-text {
            background: #f8f9fa;
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .prediction-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Прогнозирование уровня воды</h1>
        <div class="subtitle">Нейронная сеть для реки Луга - город Луга</div>

        <form id="predictionForm">
            <div class="input-group">
                <label for="var2">📊 Уровень на первый день без ледовых явлений:</label>
                <input type="number" id="var2" name="var2" step="any" required
                       placeholder="32-462 см">
            </div>

            <div class="input-group">
                <label for="var3">🌡️ Средняя температура воздуха в феврале:</label>
                <input type="number" id="var3" name="var3" step="any" required
                       placeholder="-16.1 - 1.9 °C">
            </div>

            <button type="submit">🔮 Рассчитать прогноз</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <div class="container">
        <h2>📈 Фактические и прогнозируемые значения (2010-2021)</h2>
        <div id="comparisonChart" style="height: 450px;"></div>
    </div>

    <div class="container">
        <h2>📉 Ошибка прогноза по годам</h2>
        <div id="errorChart" style="height: 450px;"></div>
    </div>

    <div class="container">
        <h2>📊 Статистика модели</h2>
        <div class="stats-grid" id="stats"></div>
        <div class="info-text">
            💡 Прогнозы модели сравниваются с фактическими значениями уровня воды (Луга-Луга)
        </div>
    </div>

    <script>
        // Данные для графиков
        const years = [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2021];
        const predicted = [253, 105, 84, 39, 61, 66, 40, 270, 215, 287, 130];
        const actual = [454, 453, 369, 406, 235, 279, 272, 285, 352, 334, 321];
        
        // Расчет ошибок
        const errors = actual.map((a, i) => Math.abs(a - predicted[i]));
        const mae = (errors.reduce((a, b) => a + b, 0) / errors.length).toFixed(2);
        const maxError = Math.max(...errors);
        
        // Расчет корреляции
        const n = actual.length;
        const sumX = actual.reduce((a, b) => a + b, 0);
        const sumY = predicted.reduce((a, b) => a + b, 0);
        const sumXY = actual.reduce((sum, xi, i) => sum + xi * predicted[i], 0);
        const sumX2 = actual.reduce((sum, xi) => sum + xi * xi, 0);
        const sumY2 = predicted.reduce((sum, yi) => sum + yi * yi, 0);
        const correlation = ((n * sumXY - sumX * sumY) / Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY))).toFixed(4);
        
        // Расчет точности
        const relativeErrors = errors.map((e, i) => e / actual[i] * 100);
        const mape = relativeErrors.reduce((a, b) => a + b, 0) / relativeErrors.length;
        const accuracy = (100 - mape).toFixed(2);
        
        // Отображение статистики
        document.getElementById('stats').innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${mae} см</div>
                <div class="stat-label">Средняя ошибка</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${maxError} см</div>
                <div class="stat-label">Максимальная ошибка</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${accuracy}%</div>
                <div class="stat-label">Точность модели</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${correlation}</div>
                <div class="stat-label">Корреляция</div>
            </div>
        `;
        
        // График 1: Сравнение
        const comparisonTrace1 = {
            x: years,
            y: actual,
            name: 'Фактические значения',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#2E86AB', width: 3 },
            marker: { size: 10, color: '#2E86AB' }
        };

        const comparisonTrace2 = {
            x: years,
            y: predicted,
            name: 'Прогноз модели',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#A23B72', width: 3, dash: 'dash' },
            marker: { size: 10, color: '#A23B72', symbol: 'diamond' }
        };

        const comparisonLayout = {
            xaxis: { title: 'Год', tickangle: -45 },
            yaxis: { title: 'Уровень воды (см)' },
            hovermode: 'closest'
        };

        Plotly.newPlot('comparisonChart', [comparisonTrace1, comparisonTrace2], comparisonLayout);
        
        // График 2: Ошибки
        const errorTrace = {
            x: years,
            y: errors,
            type: 'bar',
            marker: {
                color: errors.map(err => err > 100 ? '#dc3545' : (err > 50 ? '#ffc107' : '#28a745'))
            },
            text: errors.map(err => err.toFixed(2) + ' см'),
            textposition: 'auto'
        };

        const errorLayout = {
            xaxis: { title: 'Год', tickangle: -45 },
            yaxis: { title: 'Ошибка (см)' }
        };

        Plotly.newPlot('errorChart', [errorTrace], errorLayout);
        
        // Отправка формы
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const var2 = parseFloat(formData.get('var2'));
            const var3 = parseFloat(formData.get('var3'));

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">⏳ Расчет...</div>';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Результат расчёта:</h3>
                            <div class="prediction-value">${result.prediction} см</div>
                            <div class="prediction-info">
                                📊 При входных данных:<br>
                                • Уровень: ${var2} см<br>
                                • Температура: ${var3} °C
                            </div>
                        </div>`;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Ошибка:</h3>
                            <p>${result.error}</p>
                        </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Ошибка:</h3>
                        <p>Не удалось подключиться к серверу</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
