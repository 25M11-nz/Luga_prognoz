<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейронная сеть - Прогнозирование уровня воды</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba1 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 2rem auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }

        h2 {
            color: #555;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #555;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba1 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .result {
            margin-top: 1.5rem;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }

        .prediction-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba1 100%);
            color: white;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 0.3rem;
        }

        .info-text {
            background: #f8f9fa;
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .prediction-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Прогнозирование уровня воды</h1>
        <div class="subtitle">Нейронная сеть для реки Луга - город Луга</div>

        <form id="predictionForm">
            <div class="input-group">
                <label for="var2">📊 Уровень на первый день без ледовых явлений, см:</label>
                <input type="number" id="var2" name="var2" step="any" required
                       placeholder="">
            </div>

            <div class="input-group">
                <label for="var3">🌡️ Средняя температура воздуха в феврале, °C:</label>
                <input type="number" id="var3" name="var3" step="any" required
                       placeholder="">
            </div>

            <button type="submit">🔮 Рассчитать прогноз</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <div class="container">
        <h2>📈 Фактические и прогнозируемые значения (2010-2021)</h2>
        <div id="comparisonChart" style="height: 450px;"></div>
    </div>

    <div class="container">
        <h2>📉 Ошибка прогноза по годам</h2>
        <div id="errorChart" style="height: 450px;"></div>
    </div>

    <div class="container">
        <h2>📊 Статистика модели</h2>
        <div class="stats-grid" id="stats"></div>
        <div class="info-text">
            💡 Прогнозы модели сравниваются с фактическими значениями уровня воды (Луга-Луга)
        </div>
    </div>

    <script>
        // Данные для графиков
        const years = [1950,1951,1952,1953,1954,1955,1956,1957,1958,1959,1960,1961,1962,1963,1964,1965,1966,1967,1968,1969,1970,1971,1972,1973,1974,1975,1976,1977,1978,1979,1980,1981,1982,1983,1984,1985,1986,1987,1988,1989,1991,1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2004,2005,2006,2007,2008,2009,2010,2011,2013,2014,2015,2016,2017,2018,2019,2020,2021];
        const predicted = [372,414,317,397,343,405,446,335,347,355,369,263,422,265,353,267,361,394,364,361,343,329,266,248,363,374,387,361,346,343,385,400,406,415,344,323,331,288,370,396,330,337,329,378,270,478,320,364,254,308,308,343,327,273,341,345,337,345,252,247,249,249,336,339,346,365,408,375,334];
        const actual = [345,417,407,390,271,415,467,382,303,352,358,253,422,353,259,373,449,387,366,360,317,335,305,195,367,363,382,393,331,363,364,408,394,388,379,243,361,265,369,398,333,305,388,453,161,466,364,357,294,350,284,338,294,324,290,369,340,454,406,235,272,279,334,285,344,321,402,382,291];
        
        // Расчет ошибок
        const errors = actual.map((a, i) => Math.abs(a - predicted[i]));
        const mae = (errors.reduce((a, b) => a + b, 0) / errors.length).toFixed(2);
        const maxError = Math.max(...errors);
        
        // Расчет корреляции
        const n = actual.length;
        const sumX = actual.reduce((a, b) => a + b, 0);
        const sumY = predicted.reduce((a, b) => a + b, 0);
        const sumXY = actual.reduce((sum, xi, i) => sum + xi * predicted[i], 0);
        const sumX2 = actual.reduce((sum, xi) => sum + xi * xi, 0);
        const sumY2 = predicted.reduce((sum, yi) => sum + yi * yi, 0);
        const correlation = ((n * sumXY - sumX * sumY) / Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY))).toFixed(4);
        
        // Расчет точности
        const relativeErrors = errors.map((e, i) => e / actual[i] * 100);
        const mape = relativeErrors.reduce((a, b) => a + b, 0) / relativeErrors.length;
        const accuracy = (100 - mape).toFixed(2);
        
        // Отображение статистики
        document.getElementById('stats').innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${mae} см</div>
                <div class="stat-label">Средняя ошибка</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${maxError} см</div>
                <div class="stat-label">Максимальная ошибка</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${accuracy}%</div>
                <div class="stat-label">Точность модели</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${correlation}</div>
                <div class="stat-label">Корреляция</div>
            </div>
        `;
        
        // График 1: Сравнение
        const comparisonTrace1 = {
            x: years,
            y: actual,
            name: 'Фактические значения',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#2E86AB', width: 3 },
            marker: { size: 10, color: '#2E86AB' }
        };

        const comparisonTrace2 = {
            x: years,
            y: predicted,
            name: 'Прогноз модели',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#A23B72', width: 3, dash: 'dash' },
            marker: { size: 10, color: '#A23B72', symbol: 'diamond' }
        };

        const comparisonLayout = {
            xaxis: { title: 'Год', tickangle: -45 },
            yaxis: { title: 'Уровень воды (см)' },
            hovermode: 'closest'
        };

        Plotly.newPlot('comparisonChart', [comparisonTrace1, comparisonTrace2], comparisonLayout);
        
        // График 2: Ошибки
        const errorTrace = {
            x: years,
            y: errors,
            type: 'bar',
            marker: {
                color: errors.map(err => err > 100 ? '#dc3545' : (err > 50 ? '#ffc107' : '#28a745'))
            },
            text: errors.map(err => err.toFixed(2) + ' см'),
            textposition: 'auto'
        };

        const errorLayout = {
            xaxis: { title: 'Год', tickangle: -45 },
            yaxis: { title: 'Ошибка (см)' }
        };

        Plotly.newPlot('errorChart', [errorTrace], errorLayout);
        
        // Отправка формы
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const var2 = parseFloat(formData.get('var2'));
            const var3 = parseFloat(formData.get('var3'));

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">⏳ Расчет...</div>';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Результат расчёта:</h3>
                            <div class="prediction-value">${result.prediction} см</div>
                            <div class="prediction-info">
                                📊 При входных данных:<br>
                                • Уровень: ${var2} см<br>
                                • Температура: ${var3} °C
                            </div>
                        </div>`;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Ошибка:</h3>
                            <p>${result.error}</p>
                        </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Ошибка:</h3>
                        <p>Не удалось подключиться к серверу</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
